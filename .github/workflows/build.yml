name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint Obsidian plugin
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build and validate mobile bundle
        run: npm run check:mobile
      - name: Validate release assets
        run: >-
          node -e "const fs=require('node:fs'); for (const file of
          ['main.js','manifest.json','styles.css']) { if
          (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new
          Error('Missing or empty release asset: '+file); }"
      - name: Upload plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: mdbase-obsidian-${{ github.sha }}
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
